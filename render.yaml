services:
  - type: web
    name: rutiva-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RUTIVA_DB
        value: /tmp/rutiva.db
      - key: OFFER_SECONDS
        value: '25'
      - key: SECURE_COOKIES
        value: '1'
