<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBERVZLA | Administración</title><style>body{font:16px system-ui;background:#eef2f7;color:#142238;margin:0;padding:24px}main{max-width:800px;margin:auto;background:white;padding:24px;border-radius:16px}input,button{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}input{width:100%}button{background:#4338ca;color:white;border:0;border-radius:8px;margin-top:10px}article{padding:12px;border-bottom:1px solid #ddd}p{line-height:1.5}</style><main><h1>UBERVZLA Administración</h1><p>Consulta de expedientes. No hay aprobación operativa hasta completar las integraciones de seguridad.</p><input id="key" type="password" placeholder="Clave administrativa" autocomplete="off"><button id="load">Consultar solicitudes</button><div id="result" role="status"></div></main><script>document.getElementById('load').onclick=async()=>{let out=document.getElementById('result');out.textContent='';try{let r=await fetch('/api/intake/admin',{headers:{Authorization:'Bearer '+document.getElementById('key').value},cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.detail);out.textContent=j.applicants.length+' expedientes';for(let a of j.applicants){let el=document.createElement('article');el.textContent=a.name+' · '+a.state+' · '+a.vehicle+' · '+a.files.length+'/9 documentos · '+(a.submitted?'Recibido':'Incompleto')+' · No autorizado';out.append(el)}}catch(e){out.textContent=e.message}}</script></html>
