<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBERVZLA Administración demo</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eff2f8;color:#17223a;margin:0}header{background:#101827;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}section,article{background:white;border-radius:16px;padding:18px;margin:14px 0;border:1px solid #dce2ed}button,input,select{font:inherit;padding:10px;border:1px solid #ccd3df;border-radius:8px}button{background:#4338ca;color:white;border:0;cursor:pointer;margin:5px}input[type=password]{width:100%}label{display:block;padding:6px}small{color:#536278}#msg{white-space:pre-wrap}</style><header><b>UBERVZLA · ADMINISTRACIÓN</b></header><main><h1>Aprobación de conductores</h1><p><b>Solo demostración.</b> No se verifican documentos, rostros ni antecedentes reales. No introducir datos personales.</p><section><label>Clave administrativa de Render<input id="key" type="password" autocomplete="off"></label><button id="load">Consultar solicitudes</button><p id="msg" role="status"></p></section><div id="list"></div></main><script>const $=id=>document.getElementById(id);async function api(path,body){let r=await fetch('/api/admin/drivers'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});let j=await r.json();if(!r.ok)throw Error(j.detail||'Error');return j}function el(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}async function load(){try{let data=await api('');$('list').replaceChildren();for(let u of data.drivers){let a=el('article','',$('list'));el('h2',u.name+' · '+u.login,a);el('p','Estado: '+u.status+' | '+u.vehicle+' | solicitud '+(u.submitted?'enviada':'sin enviar'),a);let checks={},dates={};for(let [k,t] of Object.entries(data.checks)){let l=el('label','',a),v=document.createElement('input');v.type='checkbox';v.checked=!!u.checks[k];checks[k]=v;l.append(v,document.createTextNode(' '+t+' (simulado)'));if(data.expiring.includes(k)){let d=document.createElement('input');d.type='date';dates[k]=d;l.append(d)}}for(let [decision,title] of Object.entries({approved:'Aprobar demo',correction:'Pedir correcciones',rejected:'Rechazar',suspended:'Suspender'})){let b=el('button',title,a);b.onclick=async()=>{try{await api('/'+u.id,{decision,checks:Object.fromEntries(Object.entries(checks).map(([k,v])=>[k,v.checked])),dates:Object.fromEntries(Object.entries(dates).map(([k,v])=>[k,v.value]))});await load();$('msg').textContent='Decisión registrada'}catch(e){$('msg').textContent=e.message}}}}$('msg').textContent=data.drivers.length+' conductor(es)'}catch(e){$('msg').textContent=e.message}}$('load').onclick=load;</script></html>
